name: neom_ar
description: >
  Cross-platform AR module for Cyberneom. Wraps ARKit (iOS) and ARCore
  (Android) behind a unified interface. Distance measurement, plane
  detection, room scanning, and 3D marker visualization for acoustic
  levitation chamber analysis.
version: 1.0.2
homepage: https://github.com/Open-Neom/neom_ar
repository: https://github.com/Open-Neom/neom_ar
issue_tracker: https://github.com/Open-Neom/neom_ar/issues
funding:
  - https://github.com/sponsors/Open-Neom

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  sint: ^2.0.2

  neom_core: ^2.0.0
  neom_commons: ^2.0.0

  vector_math: ^2.4.4


  hive_flutter: ^1.1.0


  # Platform-specific AR engines
  arkit_plugin: ^1.5.0

  arcore_flutter_plugin: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0



flutter:
